; PlatformIO Project Configuration File
;
;   Build options: build flags, source filter
;   Upload options: custom upload port, speed and extra flags
;   Library options: dependencies, extra library storages
;   Advanced options: extra scripting
;
; Please visit documentation for the other options and examples
; https://docs.platformio.org/page/projectconf.html

[env:esp32thing_plus]
framework = arduino
; platform = espressif32 @ 7.0.0
platform = https://github.com/pioarduino/platform-espressif32/releases/download/55.03.32/platform-espressif32.zip
; https://github.com/sivar2311/platform-espressif32-versions/blob/main/README.md

board = sparkfun_esp32s2_thing_plus_c
lib_deps = 
	greiman/SdFat@^2.3.1
	sparkfun/SparkFun MAX1704x Fuel Gauge Arduino Library@^1.0.3
	sparkfun/SparkFun 9DoF IMU Breakout - ICM 20948 - Arduino Library@^1.3.2
	meelonusk/TB9051FTGMotorCarrier@^1.0.2
	madhephaestus/ESP32Encoder@^0.12.0
	adafruit/Adafruit INA237 and INA238 Library@^1.0.3
	SerialMenu

; Remove the default standard (e.g., gnu++11)
build_unflags = -std=gnu++11
; Set to desired standard (e.g., C++17)
build_flags = -std=gnu++20
; >= 20 is required for lerp
; >= 17 is required for vector and variant

monitor_speed = 115200
monitor_eol = LF