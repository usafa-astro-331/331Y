;
; Please visit documentation for the other options and examples
; https://docs.platformio.org/page/projectconf.html

; [env:sparkfun_esp32s2_thing_plus_c]
; platform = espressif32
; board = sparkfun_esp32s2_thing_plus_c
; framework = arduino


[env:adafruit_feather_rp2040]
; Use Max Gerhardt's Raspberry Pi RP2040 platform (Arduino-Pico integration)
platform = https://github.com/maxgerhardt/platform-raspberrypi.git
board = adafruit_feather_adalogger
framework = arduino

; USB / serial
monitor_speed = 115200

; Optional: typical useful defines
build_flags =
    -D ARDUINO_USB_CDC_ON_BOOT=1    ; get Serial up immediately
    -D PICO_STDIO_USB=1             ; use USB stdio



lib_deps = 
	sparkfun/SparkFun 9DoF IMU Breakout - ICM 20948 - Arduino Library@^1.3.2
	meelonusk/TB9051FTGMotorCarrier@^1.0.2